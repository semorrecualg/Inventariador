name: Gerar keystore de assinatura (uma vez)

# PARA QUE SERVE
# ----------------------------------------------------------------------------
# Os APKs de campo são debug assinados com uma chave. Se essa chave muda entre
# builds, o Android recusa instalar por cima ("O app não foi instalado"). Antes
# a chave vinha de cache/geração automática do runner — instável.
#
# Este workflow gera a chave UMA VEZ e publica-a para download, para ser
# cadastrada como secret `ANDROID_DEBUG_KEYSTORE_BASE64`. Depois disso o
# `android-build.yml` usa sempre essa mesma chave (e falha se o secret faltar).
#
# O artefacto contém uma chave privada (de debug, palavra-passe pública
# `android`), mas ainda assim: baixe, cadastre o secret e APAGUE o run para não
# deixar a chave pendurada em artefactos.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    name: Gerar chave e publicar base64
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Gerar keystore de debug (alias e senhas que o build espera)
        run: |
          set -euo pipefail
          mkdir -p out

          # Estes valores NÃO são escolha livre: o android-build assina com
          # alias androiddebugkey e senhas "android". Mudar aqui quebra o build.
          keytool -genkeypair -noprompt \
            -keystore out/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          FP="$(keytool -list -v -keystore out/debug.keystore -storepass android \
            -alias androiddebugkey | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')"
          echo "Certificado (SHA-256): $FP"

          # O secret tem de ser UMA linha só.
          base64 -w0 out/debug.keystore > out/ANDROID_DEBUG_KEYSTORE_BASE64.txt
          echo "Tamanho do base64: $(wc -c < out/ANDROID_DEBUG_KEYSTORE_BASE64.txt) bytes"

          {
            echo "### Keystore de assinatura gerado"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Certificado (SHA-256) | \`$FP\` |"
            echo "| Ficheiro | \`ANDROID_DEBUG_KEYSTORE_BASE64.txt\` |"
            echo ""
            echo "1. Baixe o artefacto **android-debug-keystore**."
            echo "2. Abra \`ANDROID_DEBUG_KEYSTORE_BASE64.txt\` e copie **tudo** (uma linha)."
            echo "3. GitHub → Settings → Secrets and variables → Actions → **New repository secret**."
            echo "4. Nome: \`ANDROID_DEBUG_KEYSTORE_BASE64\` · Valor: cole o conteúdo."
            echo "5. Volte a este run e **Delete run** (a chave não deve ficar em artefactos)."
            echo ""
            echo "Guarde o SHA-256 acima: é por ele que se confirma, no APK, que a chave é a mesma."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar artefacto (1 dia)
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-keystore
          path: out/
          retention-days: 1
          if-no-files-found: error
