name: CI — Qualidade (lint · tipos · testes · build)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # O projeto vive em Inventariador-main/ (ver docs/GOVERNANCA.md § 2).
  NODE_OPTIONS: "--max-old-space-size=4096"
  # Obrigatório: rbacService captura VITE_ADMIN_EMAIL no load do módulo. Sem
  # isto, 3 testes de soberania caem. O valor pode ser sobrescrito pela
  # variável de repositório VITE_ADMIN_EMAIL (Settings → Variables).
  VITE_ADMIN_EMAIL: ${{ vars.VITE_ADMIN_EMAIL || 'semorr@gmail.com' }}

jobs:
  quality:
    name: Lint · Tipos · Testes · Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Inventariador-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Inventariador-main/package-lock.json

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes unitários
        run: npm test
        env:
          VITE_ADMIN_EMAIL: ${{ vars.VITE_ADMIN_EMAIL || 'semorr@gmail.com' }}

      # Sem as duas credenciais o build continua "verde", mas o bundle nasce em
      # modo INTERNAL (100% offline). Falha aqui para não publicar artefato offline.
      - name: Validar credenciais do Supabase
        run: |
          set -euo pipefail
          faltando=""
          [ -n "${VITE_SUPABASE_URL:-}" ] || faltando="VITE_SUPABASE_URL"
          [ -n "${VITE_SUPABASE_ANON_KEY:-}" ] || faltando="${faltando:+$faltando, }VITE_SUPABASE_ANON_KEY"
          if [ -n "$faltando" ]; then
            echo "::error::Secret(s) ausente(s): $faltando. Cadastre em Settings -> Secrets and variables -> Actions; sem eles o build sai em modo INTERNAL (offline)."
            exit 1
          fi
          echo "Credenciais do Supabase presentes (URL e chave publica)."
          # Presente mas malformado é pior que ausente: gera bundle que abre com
          # "Invalid supabaseUrl". A app já cai para INTERNAL, mas avisamos aqui.
          if ! printf '%s' "$VITE_SUPABASE_URL" | grep -Eq '^https?://[A-Za-z0-9._-]+/?$'; then
            echo "::warning::VITE_SUPABASE_URL não é um URL http(s) válido (falta o esquema ou tem caracteres estranhos). O build vai arrancar em modo INTERNAL (offline)."
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build de produção
        run: npm run build
        env:
          VITE_ADMIN_EMAIL: ${{ vars.VITE_ADMIN_EMAIL || 'semorr@gmail.com' }}
          # Secrets do Supabase (Settings → Secrets and variables → Actions).
          # O passo acima falha se algum faltar, então o build nunca sai
          # silenciosamente em modo INTERNAL.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
