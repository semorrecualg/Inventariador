name: Build Android APK (versão lida do package.json)

# APK SOB DEMANDA — o build nativo não roda a cada merge em main (gastava
# vários minutos de runner e produzia um APK que ninguém pediu). Ele nasce em
# dois gestos, e só neles:
#   1. pedido explícito: Actions → "Build Android APK" → Run workflow
#      (branch/commit escolhidos no próprio diálogo); ou
#   2. release: push de tag `v*` (git tag v2.7.4 && git push origin v2.7.4).
# O CI de qualidade (lint · tipos · testes · build) continua automático no
# ci.yml — o que ficou sob demanda é só o artefato Android.
#   3. pedido por comentário: `/apk` num pull request (só quem tem escrita no
#      repositório; o build sai do HEAD do PR, nunca de um fork).
on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]
  issue_comment:
    types: [ created ]

permissions:
  contents: read        # checkout do commit pedido
  pull-requests: read   # ler o HEAD do PR
  issues: write         # responder no PR (comentário de PR é issue)

concurrency:
  # Um pedido novo no mesmo PR cancela o anterior: sem builds duplicados.
  group: apk-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: '--max-old-space-size=4096' 

jobs:
  build:
    name: Generate APK 
    runs-on: ubuntu-latest
    # Comentário que não começa por /apk nem chega a abrir run (sem X vermelho
    # em conversa normal do PR).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/apk'))

    env:
      # Identidade do admin: sem isto o APK nasce sem soberania (isAdminEmail
      # sempre false). Sobrescreva em Settings → Variables. 
      VITE_ADMIN_EMAIL: ${{ vars.VITE_ADMIN_EMAIL || 'semorr@gmail.com' }}
      # Enquanto estes secrets não forem cadastrados, o build cai em INTERNAL
      # (offline) — comportamento idêntico ao anterior, sem quebrar o build.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    defaults:
      run:
        # O projeto está dentro de Inventariador-main/ no repositório
        working-directory: Inventariador-main

    steps:
      # Pedido por comentário: valida QUEM pediu antes de qualquer build.
      # Fail-closed: sem permissão de escrita (admin/maintain/write) o job para.
      - name: Validar pedido /apk
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.event.comment.user.login }}
          ASSOC: ${{ github.event.comment.author_association }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          pedido="$(printf '%s' "$BODY" | head -1 | tr -d '\r' | awk '{print $1}')"
          if [ "$pedido" != "/apk" ]; then
            echo "::error::Pedido ignorado: o comentário tem de começar por /apk."
            exit 1
          fi

          perm="$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || true)"
          case "$perm" in
            admin|maintain|write)
              echo "Permissão de $ACTOR: $perm — pedido aceite."
              ;;
            "")
              # API sem acesso (token restrito): cai na associação do comentário.
              case "$ASSOC" in
                OWNER|MEMBER|COLLABORATOR)
                  echo "Permissão de $ACTOR: $ASSOC (author_association) — pedido aceite."
                  ;;
                *)
                  echo "::error::$ACTOR não tem permissão de escrita neste repositório (author_association: $ASSOC)."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::$ACTOR não tem permissão de escrita neste repositório (permissão: $perm)."
              exit 1
              ;;
          esac

      # O comentário é sobre um PR: o build tem de sair do HEAD dele, não de main.
      - name: Resolver commit do PR
        id: request
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          info="$(gh pr view "$PR" --repo "$REPO"             --json headRefOid,headRefName,isCrossRepository,headRepositoryOwner,headRepository)"

          if [ "$(echo "$info" | jq -r .isCrossRepository)" = "true" ]; then
            echo "::error::PR de fork não gera APK: o código não é deste repositório."
            exit 1
          fi

          sha="$(echo "$info" | jq -r .headRefOid)"
          repo="$(echo "$info" | jq -r '.headRepositoryOwner.login + "/" + .headRepository.name')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "PR #$PR → $repo@$sha ($(echo "$info" | jq -r .headRefName))"

      - name: Checkout Code 
        uses: actions/checkout@v5
        with:
          # Pedido por comentário: commit exato do PR. Caso contrário, o ref do run.
          ref: ${{ steps.request.outputs.sha || github.sha }}
          repository: ${{ steps.request.outputs.repo || github.repository }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Inventariador-main/package-lock.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # Sem as duas credenciais o build continua "verde", mas o APK nasce em
      # modo INTERNAL (100% offline) — foi o sintoma do selo "MOBILE (LOCAL)".
      - name: Validar credenciais do Supabase
        run: |
          set -euo pipefail
          faltando=""
          [ -n "${VITE_SUPABASE_URL:-}" ] || faltando="VITE_SUPABASE_URL"
          [ -n "${VITE_SUPABASE_ANON_KEY:-}" ] || faltando="${faltando:+$faltando, }VITE_SUPABASE_ANON_KEY"
          if [ -n "$faltando" ]; then
            echo "::error::Secret(s) ausente(s): $faltando. Cadastre em Settings -> Secrets and variables -> Actions; sem eles o APK sai em modo INTERNAL (offline)."
            exit 1
          fi
          echo "Credenciais do Supabase presentes (URL e chave publica)."
          # URL presente mas inutilizável produzia build verde com um APK a
          # arrancar em INTERNAL (offline) — o sintoma que chegou ao campo.
          # Falhar aqui em vez de distribuir um APK sem nuvem. A validação
          # repete a normalização de src/services/supabaseService.ts (trim,
          # aspas acidentais, esquema em falta) para não barrar valores que a
          # app consegue recuperar; só falha o que a app também descartaria.
          node -e 'const bruto = (process.env.VITE_SUPABASE_URL || "").trim().replace(/^["\x27]|["\x27]$/g, "").trim();
            const candidato = /^https?:\/\//i.test(bruto) ? bruto : `https://${bruto}`;
            let url = null;
            try { const u = new URL(candidato); if ((u.protocol === "http:" || u.protocol === "https:") && u.hostname.includes(".")) url = u; } catch { url = null; }
            // A app usa a origem como base e concatena /rest/v1 e /auth/v1;
            // um caminho herdado (".../rest/v1") faz as chamadas falharem.
            if (url && url.pathname.replace(/\/+$/, "") !== "") {
              console.error("::error::VITE_SUPABASE_URL deve ser só a origem, sem caminho (ex.: https://<projeto>.supabase.co). Valor actual tem o caminho: " + url.pathname);
              process.exit(1);
            }
            if (!url) {
              console.error("::error::VITE_SUPABASE_URL inutilizável como URL http(s) — use algo como https://<projeto>.supabase.co. Sem isto o APK arrancaria em modo INTERNAL (offline).");
              process.exit(1);
            }
            console.log(`URL do Supabase válida (host: ${url.hostname}).`);'

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Construção e Sincronização da Plataforma Nativa
        run: |
          set -euo pipefail

          # 0. Extrair versão do package.json dinamicamente
          APP_VERSION=$(node -e "console.log(require('./package.json').version)")
          VERSION_CODE=$(echo "$APP_VERSION" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }' | sed 's/^0*//')
          echo "📦 Versão detectada: $APP_VERSION (versionCode: $VERSION_CODE)"

          # 1. Cria a pasta nativa se não existir
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "📁 Diretório android já existe — pulando cap add"
          fi

          # 2. Atualiza Gradle wrapper via sed (NÃO usar ./gradlew wrapper — ele configura o projeto com o wrapper antigo e quebra no bcprov)
          #    Gradle 8.2.1 (gerado pelo Capacitor) tem ASM que não suporta Java 21 class files (major version 65)
          #    Esta edição direta faz o ./gradlew seguinte baixar 8.11.1 já com ASM compatível
          sed -i 's|distributionUrl=.*gradle-[0-9.]*-.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties

          # 3. Gera as permissões oficiais no Manifesto
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="GBR KARDEK"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:requestLegacyExternalStorage="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name="com.gbr.kardek.MainActivity"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:exported="true"
                      android:label="GBR KARDEK"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths"></meta-data>
                  </provider>
              </application>
          </manifest>
          MANIFEST_EOF

          # 4. Injeta versão no build.gradle
          sed -i "s/versionCode 1/versionCode ${VERSION_CODE}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${APP_VERSION}\"/g" android/app/build.gradle
          sed -i 's/io.ionic.starter/com.gbr.kardek/g' android/app/build.gradle
          sed -i 's/com.example.app/com.gbr.kardek/g' android/app/build.gradle

          # 5. Gera gradle.properties
          cat > android/gradle.properties << 'GRADLE_EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          GRADLE_EOF

          # 6. Sincroniza os ativos web
          npx cap sync android

      - name: Gradle Cache — Restore/Save com chave previsível
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-8.11.1-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-8.11.1-
            gradle-cache-${{ runner.os }}-

      # Sem isto, cada execução do runner gera um debug.keystore novo e o APK
      # sai assinado por uma chave diferente a cada build: o Android recusa a
      # instalação por cima da versão anterior ("O app não foi instalado").
      - name: Keystore de assinatura estável — cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Keystore de assinatura estável — secret (prioritário)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "Sem secret ANDROID_DEBUG_KEYSTORE_BASE64 — vale o keystore do cache."
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          echo "Keystore restaurado do secret ANDROID_DEBUG_KEYSTORE_BASE64."

      # O AGP procura o keystore em ANDROID_USER_HOME / ANDROID_SDK_HOME; neste
      # runner isso aponta para fora de ~/.android, então ele gerava uma chave
      # nova a cada build (o cache ficava vazio e a assinatura mudava).
      # Criar o ficheiro aqui e fixar as variáveis garante o mesmo keystore
      # sempre.
      - name: Keystore de assinatura estável — criar se ausente
        run: |
          set -euo pipefail
          KS="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ -f "$KS" ]; then
            echo "Keystore já presente (cache ou secret) — reutilizado."
          else
            keytool -genkeypair -noprompt \
              -keystore "$KS" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Keystore de debug criado; será guardado no cache para os próximos builds."
          fi
          keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey \
            | grep -m1 'SHA256:' || true

      - name: Build Debug APK
        run: |
          set -euo pipefail
          # Fixa o local do keystore que o AGP usa ao assinar.
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_SDK_HOME="$HOME"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          echo "--- keystores encontrados no runner ---"
          find "$HOME" /usr/local/lib/android -name 'debug.keystore' 2>/dev/null | head -5 || true

      - name: Renomear APK com versão
        id: apk
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          VERSION=$(node -e "console.log(require('./package.json').version)")
          DATE=$(date +'%Y%m%d')
          NEW_NAME="gbr-kardek-v${VERSION}-${DATE}.apk"
          cp "$APK_PATH" "android/app/build/outputs/apk/debug/${NEW_NAME}"
          echo "name=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "✅ APK gerado: ${NEW_NAME}"

      # Verificação explícita: se o APK sair inválido ou com assinatura trocada,
      # o job falha aqui em vez de entregar um ficheiro que o telemóvel recusa.
      - name: Verificar APK e publicar SHA-256
        run: |
          set -euo pipefail
          APK="$(ls -1 android/app/build/outputs/apk/debug/gbr-kardek-*.apk | head -1)"
          unzip -t "$APK" > /dev/null

          # A credencial tem de ter ficado embutida no bundle: se não estiver, a
          # app arranca em INTERNAL (offline) — foi o que chegou ao campo na
          # 2.7.1. Falha aqui em vez de publicar um APK sem nuvem.
          HOST="$(node -e 'const b = (process.env.VITE_SUPABASE_URL || "").trim().replace(/^["\x27]|["\x27]$/g, "");
            const c = /^https?:\/\//i.test(b) ? b : `https://${b}`;
            try { console.log(new URL(c).host); } catch { process.exit(1); }')"
          if ! unzip -p "$APK" 'assets/public/assets/*.js' 2>/dev/null | grep -qF "$HOST"; then
            echo "::error::APK saiu em modo INTERNAL: a URL do Supabase (${HOST}) não está embutida no bundle. Confirme o secret VITE_SUPABASE_URL."
            exit 1
          fi
          echo "Credencial do Supabase embutida no APK (${HOST})."

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(ls -1 "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "${APKSIGNER:-}" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apksigner.txt
            CERT_SHA256="$(grep -m1 'SHA-256 digest' /tmp/apksigner.txt | sed 's/.*: //' || true)"
          else
            echo "::warning::apksigner não encontrado; verificação de assinatura ignorada."
            CERT_SHA256="desconhecido"
          fi

          # O APK tem de estar assinado com o keystore estável; se não estiver,
          # o build falha aqui em vez de gerar um APK que o telemóvel recusa.
          normalize() { printf '%s' "$1" | tr -d ':' | tr 'A-F' 'a-f'; }
          EXPECTED="$(normalize "$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')")"
          ACTUAL="$(normalize "$CERT_SHA256")"
          echo "Certificado esperado (keystore): ${EXPECTED}"
          echo "Certificado do APK:              ${ACTUAL}"
          if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "--- keystores presentes no runner (diagnóstico) ---"
            while IFS= read -r ks; do
              echo "keystore: $ks"
              keytool -list -v -keystore "$ks" -storepass android -alias androiddebugkey 2>/dev/null | grep -m1 'SHA256:' || true
            done < <(find "$HOME" /usr/local/lib/android -name 'debug.keystore' 2>/dev/null | head -5)
            echo "::error::O APK não foi assinado com o keystore estável — a instalação por cima da versão anterior vai falhar."
            exit 1
          fi

          sha256sum "$APK" | tee "$APK.sha256"
          APK_SHA256="$(cut -d' ' -f1 "$APK.sha256")"
          SIZE="$(stat -c %s "$APK")"

          {
            echo "### APK Android"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Ficheiro | \`$(basename "$APK")\` |"
            echo "| Tamanho | ${SIZE} bytes |"
            echo "| SHA-256 do APK | \`${APK_SHA256}\` |"
            echo "| SHA-256 do certificado | \`${CERT_SHA256}\` |"
            echo ""
            echo "O certificado deve ser o mesmo entre builds; se mudar, a instalação"
            echo "por cima da versão anterior é recusada com \"O app não foi instalado\"."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gbr-kardek-apk
          path: |
            ${{ github.workspace }}/Inventariador-main/android/app/build/outputs/apk/debug/gbr-kardek-*.apk
            ${{ github.workspace }}/Inventariador-main/android/app/build/outputs/apk/debug/gbr-kardek-*.apk.sha256
          retention-days: 7
          if-no-files-found: error

      # Fecha o ciclo do pedido: o run de /apk não aparece nos checks do PR,
      # então sem este comentário ninguém sabe se o APK saiu (nem onde).
      - name: Responder no PR
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          RESULTADO: ${{ job.status }}
          ARQUIVO: ${{ steps.apk.outputs.name }}
          SHA: ${{ steps.request.outputs.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$RESULTADO" = "success" ]; then
            {
              echo "### APK gerado ✅"
              echo ""
              echo "| Campo | Valor |"
              echo "|---|---|"
              echo "| Ficheiro | \`${ARQUIVO:-gbr-kardek-apk}\` |"
              echo "| Commit | \`${SHA}\` |"
              echo "| Run | [abrir]($RUN_URL) |"
              echo ""
              echo "Download: **Actions → este run → Artifacts → \`gbr-kardek-apk\`** (7 dias)."
            } > /tmp/msg.md
          else
            {
              echo "### APK não gerado ❌"
              echo ""
              echo "O build terminou em \`${RESULTADO}\`. Veja o log: [abrir run]($RUN_URL)."
            } > /tmp/msg.md
          fi
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/msg.md
