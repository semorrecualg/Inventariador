name: Build Android APK (Native Ready v2.6)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --force

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Sync Capacitor Android
        run: |
          npm install @capacitor/cli@6.2.1 @capacitor/android@6.2.1 --no-save --legacy-peer-deps --force
          npx cap add android || true
          npx cap sync android

      - name: Patch Android Native Configuration via Init Script (GBR Protocol v2.6)
        run: |
          # 1. Invalidação preventiva de caches corrompidos no Runner
          echo ">>> [GBR] Cleaning potential corrupt caches..."
          rm -rf ~/.gradle/caches/jars-9/
          rm -rf ~/.gradle/caches/modules-2/files-2.1/org.bouncycastle/
          
          # 2. Criar um init.gradle global para forçar a dependência em ABSOLUTAMENTE TODOS os projetos e subprojetos
          mkdir -p ~/.gradle
          cat <<EOF > ~/.gradle/init.gradle
          allprojects {
              buildscript {
                  configurations.all {
                      resolutionStrategy {
                          force 'org.bouncycastle:bcprov-jdk18on:1.79'
                      }
                  }
              }
              configurations.all {
                  resolutionStrategy {
                      force 'org.bouncycastle:bcprov-jdk18on:1.79'
                      eachDependency { DependencyResolveDetails details ->
                          if (details.requested.group == 'org.bouncycastle') {
                              details.useVersion '1.79'
                          }
                      }
                  }
              }
          }
          EOF
          echo ">>> [GBR] init.gradle globally registered"

          # 3. Configurar gradle.properties agressivo contra concorrência
          cat <<EOF > android/gradle.properties
          # GBR PROTOCOL v2.6 - Estabilidade CI/CD Suprema
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.daemon=false
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          echo ">>> [GBR] created/updated android/gradle.properties"

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-build-cache --refresh-dependencies --stacktrace

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gbr-inventario-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
