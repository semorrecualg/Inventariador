name: Build Android APK (Native Ready v2.6)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --force

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Sync Capacitor Android
        run: |
          npm install @capacitor/cli@6.2.1 @capacitor/android@6.2.1 --no-save --legacy-peer-deps --force
          npx cap add android || true
          npx cap sync android

      - name: Definitve Fix - Dependency Substitution (GBR Protocol v2.6)
        run: |
          mkdir -p ~/.gradle
          cat <<EOF > ~/.gradle/init.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      // Substitui a biblioteca problemática da JDK18 pela versão retrocompatível estável
                      dependencySubstitution {
                          substitute module('org.bouncycastle:bcprov-jdk18on') using module('org.bouncycastle:bcprov-jdk15to18:1.77')
                      }
                      // Força a versão limpa para qualquer outra chamada transitiva
                      force 'org.bouncycastle:bcprov-jdk15to18:1.77'
                  }
              }
          }
          EOF

          # Garante propriedades limpas de compilação
          cat <<EOF > android/gradle.properties
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.daemon=false
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-build-cache

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gbr-inventario-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
