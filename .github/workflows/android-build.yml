name: Build Android APK (Native Ready v2.6)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --force

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Ultimate Definitive Fix - Core Plugin Resolution (GBR Protocol v2.6)
        run: |
          # 1. Remove o plugin antigo do capacitor/device que carrega a dependência incompatível
          npm uninstall @capacitor/device
          
          # 2. Instala a versão atualizada e estável do plugin que removeu o Bouncy Castle do buildscript core
          npm install @capacitor/device@6.0.2 --save-exact
          
          # 3. Sincroniza e força o Gradle a limpar metadados antigos de buildscripts
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          # O flag '--no-daemon' impede que instâncias em segundo plano segurem caches corrompidos no runner
          ./gradlew assembleDebug --no-build-cache --no-daemon --stacktrace

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gbr-inventario-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
