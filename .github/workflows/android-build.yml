name: Build Android APK (Native Ready v2.6)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --force

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Native Sync (GBR Protocol v2.6)
        run: |
          # 1. Instala os plugins necessários sem reinstalar a plataforma do zero
          npm install @capacitor/device@6.0.2 @capacitor/android@6.2.1 --save-exact
          
          # 2. Apenas sincroniza o build do React (dist) com a pasta nativa existente
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-build-cache --no-daemon --stacktrace

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gbr-inventario-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
