name: Build Android APK (Native Ready v2.6)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --force

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Sync Capacitor Android
        run: |
          npm install @capacitor/cli@6.2.1 @capacitor/android@6.2.1 --no-save --legacy-peer-deps --force
          npx cap add android || true
          npx cap sync android

      - name: Definitive CI/CD Fix - Global BouncyCastle Exclusion (GBR Protocol v2.6)
        run: |
          mkdir -p ~/.gradle
          
          # Injeta uma regra de exclusão agressiva na raiz de resolução do Gradle
          cat <<EOF > ~/.gradle/init.gradle
          allprojects {
              configurations.all { configuration ->
                  // Remove o vínculo que faz o Gradle tentar baixar e validar o JAR assinado
                  dependencies {
                      modules {
                          module("org.bouncycastle:bcprov-jdk18on") {
                              replacedBy("org.bouncycastle:bcprov-jdk15to18", "Substituição de Criptografia para Java 17")
                          }
                      }
                  }
                  
                  // Remove completamente a dependência transitiva do capacitor-device
                  exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
                  exclude group: 'org.bouncycastle', module: 'bcprov-ext-jdk18on'
              }
          }
          EOF
          echo ">>> [GBR] Global exclusion init.gradle created"

          # Ajusta parâmetros de memória do Gradle para o ambiente virtualizado do GitHub
          cat <<EOF > android/gradle.properties
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.daemon=false
          org.gradle.caching=false
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          echo ">>> [GBR] gradle.properties updated for CI environment"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-build-cache --stacktrace

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gbr-inventario-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
