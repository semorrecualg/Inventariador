<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="google" content="notranslate">
    <title>Auditoria Patrimonial</title>
    <style>
        #app-loader {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: white;
            font-family: sans-serif;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        #app-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="notranslate">
    <div id="app-loader">
        <div style="text-align: center;">
            <h1 style="font-size: 20px; margin-bottom: 10px;">Carregando Auditoria...</h1>
            <p style="font-size: 12px; color: #94a3b8;">Iniciando sistema de auditoria v24.50</p>
        </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
        // Fallback para remover o loader caso o React demore ou falhe silenciosamente
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('app-loader');
                if (loader && !window.appStarted) {
                    console.warn("App taking too long to start, forcing loader removal...");
                    loader.classList.add('hidden');
                }
            }, 5000);
        });
    </script>
</body>
</html>
