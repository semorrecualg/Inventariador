<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="google" content="notranslate">
    <title>GBR Auditoria Patrimonial</title>
    <style>
        #app-loader {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: white;
            font-family: sans-serif;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        #app-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="notranslate">
    <div id="app-loader">
        <div style="text-align: center;">
            <img src="/logo.png" alt="Logo" style="width: 80px; height: 80px; margin-bottom: 20px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.1);" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div style="display: none; width: 80px; height: 80px; margin: 0 auto 20px; background: rgba(255,255,255,0.05); border-radius: 20px; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.1);">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
            </div>
            <h1 style="font-size: 20px; margin-bottom: 10px;">Carregando GBR Auditoria...</h1>
            <p style="font-size: 12px; color: #94a3b8;">Iniciando sistema de auditoria v24.50</p>
        </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
        // Fallback para remover o loader caso o React demore ou falhe silenciosamente
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('app-loader');
                if (loader && !window.appStarted) {
                    console.warn("App taking too long to start, forcing loader removal...");
                    loader.classList.add('hidden');
                }
            }, 5000);
        });
    </script>
</body>
</html>
