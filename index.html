    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* Slate 950 para economia de bateria */
            margin: 0;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        input, textarea { font-size: 16px !important; background-color: #0f172a !important; color: white !important; }
        
        /* Redução de animações para economizar CPU */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fadeIn { animation: fadeIn 0.15s ease-out; }
        
        /* Desabilitar efeitos pesados em mobile para bateria */
        .no-blur { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
    </style>
