name: Build Android APK (Native Ready v2.7)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      variant:
        description: "Tipo de APK a gerar"
        type: choice
        options:
          - release
          - debug
        default: release

env:
  NODE_OPTIONS: '--max-old-space-size=4096'

permissions:
  contents: read

jobs:
  build:
    name: Generate APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Inventariador-main
    env:
      # `secrets` só pode ser avaliado em `env`, não em `if:`.
      SIGNING_AVAILABLE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Inventariador-main/package-lock.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Construção e Sincronização da Plataforma Nativa (GBR Protocol v2.7)
        run: |
          set -euo pipefail
          APP_VERSION=$(node -e "console.log(require('./package.json').version)")
          VERSION_CODE=$(echo "$APP_VERSION" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }' | sed 's/^0*//')
          echo "📦 Versão detectada: $APP_VERSION (versionCode: $VERSION_CODE)"

          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "📁 Diretório android já existe — pulando cap add"
          fi

          sed -i 's|distributionUrl=.*gradle-[0-9.]*-.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties

          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="GBR KARDEK"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:requestLegacyExternalStorage="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name="com.gbr.kardek.MainActivity"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:exported="true"
                      android:label="GBR KARDEK"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths"></meta-data>
                  </provider>
              </application>
          </manifest>
          MANIFEST_EOF

          sed -i "s/versionCode 1/versionCode ${VERSION_CODE}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${APP_VERSION}\"/g" android/app/build.gradle
          sed -i 's/io.ionic.starter/com.gbr.kardek/g' android/app/build.gradle
          sed -i 's/com.example.app/com.gbr.kardek/g' android/app/build.gradle

          cat > android/gradle.properties << 'GRADLE_EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          GRADLE_EOF

          npx cap sync android

      - name: Gradle Cache — Restore/Save com chave isolada
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-v2.7-${{ hashFiles('Inventariador-main/package-lock.json') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-v2.7-

      - name: Exigir keystore para o APK de release
        if: ${{ inputs.variant == 'release' && env.SIGNING_AVAILABLE != 'true' }}
        run: |
          echo "::error::APK de release pedido, mas falta a keystore. Criar os secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD (ver README/AGENTS)."
          exit 1

      - name: Preparar keystore de release
        if: ${{ inputs.variant != 'debug' && env.SIGNING_AVAILABLE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/kardek-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          # O AGP lê as propriedades `android.injected.signing.*` e assina a
          # variante release sem alterar o build.gradle gerado pelo Capacitor.
          # Ficam em ~/.gradle/gradle.properties para não aparecerem na linha de
          # comando; o ficheiro é removido no fim do job.
          mkdir -p ~/.gradle
          sed -i '/^android\.injected\.signing\./d' ~/.gradle/gradle.properties 2>/dev/null || true
          {
            echo "android.injected.signing.store.file=$KEYSTORE_PATH"
            echo "android.injected.signing.store.password=$STORE_PASSWORD"
            echo "android.injected.signing.key.alias=$KEY_ALIAS"
            echo "android.injected.signing.key.password=$KEY_PASSWORD"
          } >> ~/.gradle/gradle.properties
          chmod 600 ~/.gradle/gradle.properties
          echo "✅ Keystore preparada (alias: $KEY_ALIAS)"

      - name: Build Release APK (assinado)
        if: ${{ inputs.variant != 'debug' && env.SIGNING_AVAILABLE == 'true' }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::O assembleRelease não produziu um APK assinado ($APK). Verificar a keystore/secrets."
            ls -l app/build/outputs/apk/release || true
            exit 1
          fi

      - name: Build Debug APK
        if: ${{ inputs.variant == 'debug' || env.SIGNING_AVAILABLE != 'true' }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Renomear APK com versão
        run: |
          set -euo pipefail
          VERSION=$(node -e "console.log(require('./package.json').version)")
          DATE=$(date +'%Y%m%d')
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$RELEASE_APK" ]; then
            SRC="$RELEASE_APK"; KIND="release"
          elif [ -f "$DEBUG_APK" ]; then
            SRC="$DEBUG_APK"; KIND="debug"
          else
            echo "::error::Nenhum APK encontrado para renomear."
            exit 1
          fi
          NEW_NAME="gbr-kardek-v${VERSION}-${DATE}-${KIND}.apk"
          cp "$SRC" "android/app/build/outputs/apk/${KIND}/${NEW_NAME}"
          echo "✅ APK gerado: ${NEW_NAME} (${KIND})"
          {
            echo "### APK ${KIND} — v${VERSION}"
            echo ""
            echo "- Ficheiro: \`${NEW_NAME}\`"
            echo "- versionCode: $(echo "$VERSION" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')"
            echo "- Build: ${KIND}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: gbr-kardek-apk
          path: ${{ github.workspace }}/Inventariador-main/android/app/build/outputs/apk/*/gbr-kardek-*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Limpar material de assinatura
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/kardek-release.keystore" 2>/dev/null || true
          if [ -f ~/.gradle/gradle.properties ]; then
            sed -i '/^android\.injected\.signing\./d' ~/.gradle/gradle.properties || true
          fi
          echo "🧹 Keystore e propriedades de assinatura removidas do runner."
