name: Build Android APK (Native Ready v2.7)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  build:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --force

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Construção e Sincronização da Plataforma Nativa (GBR Protocol v2.7)
        run: |
          set -euo pipefail

          # 0. Extrair versão do package.json dinamicamente
          APP_VERSION=$(node -e "console.log(require('./package.json').version)")
          VERSION_CODE=$(echo "$APP_VERSION" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }' | sed 's/^0*//')
          echo "📦 Versão detectada: $APP_VERSION (versionCode: $VERSION_CODE)"

          # 1. Garante a instalação do pacote core do Android (sem modificar package.json do repositório)
          npm install @capacitor/android@6.2.1 --no-save

          # 2. Cria a pasta nativa na máquina virtual se ela não existir
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "📁 Diretório android já existe — pulando cap add"
          fi

          # 3. Gera as permissões oficiais no Manifesto
          cat > android/app/src/main/AndroidManifest.xml << 'MANIFEST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="GBR KARDEK"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:requestLegacyExternalStorage="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name="com.gbr.kardek.MainActivity"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:exported="true"
                      android:label="GBR KARDEK"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths"></meta-data>
                  </provider>
              </application>
          </manifest>
          MANIFEST_EOF

          # 4. Injeta dinamicamente a versão extraída do package.json no build.gradle
          sed -i "s/versionCode 1/versionCode ${VERSION_CODE}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${APP_VERSION}\"/g" android/app/build.gradle
          sed -i 's/io.ionic.starter/com.gbr.kardek/g' android/app/build.gradle
          sed -i 's/com.example.app/com.gbr.kardek/g' android/app/build.gradle

          # 5. Gera gradle.properties com alocação de memória adequada para CI
          cat > android/gradle.properties << 'GRADLE_EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          GRADLE_EOF

          # 6. Sincroniza os ativos web do React
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          # gradle.properties já define Xmx2048m e demais flags (gerado no passo anterior)
          ./gradlew assembleDebug --no-build-cache --no-daemon --stacktrace

      - name: Renomear APK com versão
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          VERSION=$(node -e "console.log(require('./package.json').version)")
          DATE=$(date +'%Y%m%d')
          NEW_NAME="gbr-kardek-v${VERSION}-${DATE}.apk"
          cp "$APK_PATH" "android/app/build/outputs/apk/debug/${NEW_NAME}"
          echo "✅ APK gerado: ${NEW_NAME}"

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gbr-kardek-apk
          path: android/app/build/outputs/apk/debug/gbr-kardek-*.apk
          retention-days: 7
          if-no-files-found: error
